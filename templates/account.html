<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Account - Secure Share</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
body{ background: radial-gradient(circle at top, #0a0a12, #050507, #020203); color:#d1d1d1; font-family:'Share Tech Mono', monospace; min-height:100vh; overflow-y:auto; overflow-x:hidden; position:relative; }
#floating-container{ position:fixed; top:0; left:0; width:100%; height:100vh; pointer-events:none; z-index:1;}
.panel{ max-width:520px; margin:80px auto; padding:35px; background: rgba(20,20,30,0.65); border-radius:14px; border:2px solid #3a3a3a; box-shadow:0 0 12px #3a9efb44; text-align:left; z-index:10; }
.top-bar{ max-width:520px; margin:20px auto 0; display:flex; justify-content:space-between; align-items:center; z-index:10; position:relative; font-size:15px;}
.top-bar a{ color:#9cd2ff; text-decoration:none;}
.top-bar a:hover{text-decoration:underline;}
input{ background: rgba(255,255,255,0.05); border:1px solid #606060; color:white; width:100%; padding:8px; border-radius:4px; margin-bottom:10px; }
.btn-primary-custom{ background:#2e2e2e; color:white; border:1px solid #666; padding:10px 18px; border-radius:6px; }
.password-hint{ color:#cbd6ff; }
</style>
<script>
window.onload=function(){
    const container=document.createElement('div'); container.id='floating-container'; document.body.appendChild(container);
    const numIcons=40; let icons=[];
    for(let i=0;i<numIcons;i++){
        const icon=document.createElement('i'); icon.className=(i%2===0)?'fas fa-lock':'fas fa-link';
        icon.style.position='absolute'; icon.style.fontSize=(12+Math.random()*16)+'px'; icon.style.opacity=0.3+Math.random()*0.7;
        icon.style.left=Math.random()*(window.innerWidth-20)+'px'; icon.style.top=Math.random()*(window.innerHeight-20)+'px';
        icon.dx=(Math.random()*0.5+0.1)*(Math.random()<0.5?1:-1); icon.dy=(Math.random()*0.3+0.05)*(Math.random()<0.5?1:-1);
        container.appendChild(icon); icons.push(icon);
    }
    function animateIcons(){ const width=window.innerWidth, height=window.innerHeight; icons.forEach(icon=>{
        let x=parseFloat(icon.style.left), y=parseFloat(icon.style.top); x+=icon.dx; y+=icon.dy;
        if(x<0){x=0;icon.dx*=-1;} if(x>width-20){x=width-20;icon.dx*=-1;}
        if(y<0){y=0;icon.dy*=-1;} if(y>height-20){y=height-20;icon.dy*=-1;}
        icon.style.left=x+'px'; icon.style.top=y+'px'; if(Math.random()<0.005) icon.style.opacity=0.3+Math.random()*0.7;
    }); requestAnimationFrame(animateIcons); } animateIcons();
};
</script>
</head>
<body>
<div class="top-bar">
    <div><i class="fas fa-shield-alt me-1"></i>Secure Share - Account</div>
    <div>
        <a href="{{ url_for('index') }}">Upload</a> |
        <a href="{{ url_for('dashboard') }}">Dashboard</a> |
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</div>
<div class="panel">
    <h2 class="mb-3">Account</h2>
    <p><strong>Username:</strong> {{ user }}</p>

    {% if message %}<div class="alert alert-success py-2">{{ message }}</div>{% endif %}
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}

    <h4 class="mt-4 mb-2">Change Password</h4>
    <form method="POST" action="{{ url_for('account') }}">
        <input type="password" name="current_password" placeholder="Current password" required>
        <input type="password" name="new_password" placeholder="New password" required>
        <div class="password-hint" style="font-size:11px;">New password must be at least 10 characters, with 1 uppercase, 1 number and 1 special character.</div>
        <button type="submit" class="btn-primary-custom mt-2">Update Password</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
